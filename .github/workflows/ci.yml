# Human PRs and nightly lock updates call the same workflow under "Checks", so
# branch protection requires one stable aggregate check name. PRs and pushes run
# the quick tier; run this workflow manually with full=true to build everything.
name: CI

on:
  push:
    branches: [dev]
  # PRs opened by github-actions[bot] wait for a maintainer's approval before any
  # workflow runs. Both kinds are fully checked by the workflow that opens them, so
  # they are skipped here: release PRs are the only PRs into main, and lock-update
  # PRs change only flake.lock. A human PR changing only flake.lock gets its required
  # check by running this workflow manually on its branch.
  pull_request:
    branches: [dev]
    paths-ignore: [flake.lock]
  workflow_dispatch:
    inputs:
      full:
        description: Build every check, including host closures and NixOS tests.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    uses: ./.github/workflows/flake-checks.yml
    with:
      ref: ${{ github.sha }}
      full: ${{ inputs.full == true }}
