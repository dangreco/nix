# Human PRs and nightly lock updates call the same full-matrix workflow under
# "Checks", so branch protection requires one stable aggregate check name.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    uses: ./.github/workflows/flake-checks.yml
    with:
      ref: ${{ github.sha }}
